name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.13' }
          - { os: macos-latest, python: '3.13' }
          - { os: windows-latest, python: '3.13' }
          - { os: ubuntu-22.04, python: '3.8' }  # oldest supported Python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Linux filesystem tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosfstools mtools fdisk ntfs-3g exfatprogs
          sudo modprobe ntfs3 || true
          sudo modprobe exfat || true

      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8
